<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manga Tracker 🇩🇪</title>
<meta name="description" content="Tracke deine deutsche Manga-Sammlung und bleib über Erscheinungstermine informiert.">
<meta name="theme-color" content="#1a1a3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Manga Tracker">
<link rel="manifest" href='data:application/manifest+json,{"name":"Manga Tracker 🇩🇪","short_name":"Manga","start_url":".","display":"standalone","background_color":"%231a1a3e","theme_color":"%231a1a3e","description":"Deutsche Manga-Sammlung tracken","icons":[{"src":"data:image/svg+xml,<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\"><rect width=\"100\" height=\"100\" rx=\"20\" fill=\"%231a1a3e\"/><text y=\".9em\" font-size=\"72\" x=\"50%\" text-anchor=\"middle\">📚</text></svg>","sizes":"any","type":"image/svg+xml"}]}'>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <h1><span class="jp">マンガ</span> Tracker 🇩🇪</h1>
    <span id="sync-dot" title="Jetzt synchronisieren" style="font-size:0.9rem;opacity:0.85;cursor:pointer" onclick="manualSync()">🔄</span>
  </div>
  <div style="display:flex;gap:6px">
    <button class="add-btn" id="btn-share-profile" style="background:rgba(255,255,255,0.15);padding:8px 10px" onclick="shareProfile()" title="Sammlung öffentlich teilen">🔗</button>
    <button class="add-btn" id="btn-add" onclick="openAdd()">＋ Hinzufügen</button>
  </div>
</header>

<div class="readonly-banner" id="readonly-banner" style="display:none">
  <span>👁 <strong>Öffentliche Ansicht</strong> — Du siehst die Sammlung von jemandem anderen</span>
  <button class="readonly-btn" onclick="startOwnCollection()">✨ Eigene Sammlung starten</button>
</div>

<div class="tabs" id="tabs">
  <div class="tab active" data-tab="reading" onclick="setTab('reading')">📖 Lese ich <span class="badge" id="c-reading">0</span></div>
  <div class="tab" data-tab="completed" onclick="setTab('completed')">✅ Gelesen <span class="badge" id="c-completed">0</span></div>
  <div class="tab" data-tab="owned" onclick="setTab('owned')">📚 Zu lesen <span class="badge" id="c-owned">0</span></div>
  <div class="tab" data-tab="wishlist" onclick="setTab('wishlist')">💜 Wunschliste <span class="badge" id="c-wishlist">0</span></div>
  <div class="tab" data-tab="buy" onclick="setTab('buy')">🛒 Zu kaufen <span class="badge" id="c-buy">0</span></div>
  <div class="tab" data-tab="kalender" onclick="setTab('kalender')">📅 Kalender <span class="badge" id="c-kalender">0</span></div>
  <div class="tab" data-tab="stats" onclick="setTab('stats')">📊 Statistiken</div>
</div>
<div class="genre-filter-wrap" id="genre-filter-wrap" style="display:none"></div>

<div class="search-bar">
  <div class="search-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search-input" id="search-input" type="search" placeholder="Manga suchen…" oninput="onSearch(this.value)" autocomplete="off">
    <button class="search-clear" id="search-clear" onclick="clearSearch()" title="Suche löschen">✕</button>
  </div>
  <span class="search-hint" id="search-hint"></span>
  <select class="sort-select" id="pub-filter" onchange="setPubFilter(this.value)" title="Verlag filtern">
    <option value="">Alle Verlage</option>
  </select>
  <select class="sort-select" id="sort-select" onchange="setSort(this.value)" title="Sortierung">
    <option value="az">A–Z</option>
    <option value="za">Z–A</option>
    <option value="next">Nächster Band</option>
    <option value="added">Hinzugefügt</option>
  </select>
  <div class="view-toggle" id="view-toggle">
    <button class="view-btn active" id="vbtn-series" onclick="setView('series')" title="Serienansicht">⊞</button>
    <button class="view-btn" id="vbtn-volumes" onclick="setView('volumes')" title="Bändenliste">☰</button>
  </div>
  <button class="view-btn" id="btn-mp-sync" onclick="mpSyncAll()" title="Alle Band-Cover via Manga Passion synchronisieren" style="font-size:0.85rem;padding:5px 9px">🖼️</button>
</div>

<div class="main">
  <div id="content"></div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" style="display:none" onclick="overlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 id="modal-title">Manga hinzufügen</h2>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="db-search-wrap">
        <input class="db-search-input" id="db-search" type="search" placeholder="🔍 Manga in Datenbank suchen…" oninput="onDbSearch(this.value)" autocomplete="off">
        <span class="db-search-spinner" id="db-spinner">⏳</span>
        <div class="db-results" id="db-results" style="display:none"></div>
      </div>
      <div class="form-group">
        <label>Titel *</label>
        <input id="f-title" type="text" placeholder="z.B. Fullmetal Alchemist">
      </div>
      <div class="row2">
        <div class="form-group">
          <label>Verlag (DE)</label>
          <select id="f-publisher">
            <option value="">– Verlag –</option>
            <option>Altraverse</option>
            <option>Carlsen Manga</option>
            <option>Cross Cult</option>
            <option>Crunchyroll Manga</option>
            <option>dani books</option>
            <option>Dokico</option>
            <option>Egmont Manga</option>
            <option>Hayabusa</option>
            <option>Kazé Manga</option>
            <option>Manga Cult</option>
            <option>MangaMoon</option>
            <option>Panini Manga</option>
            <option>Planet Manga</option>
            <option>Splitter Verlag</option>
            <option>Tokyopop</option>
            <option>Yomeru</option>
            <option value="Anderer">Anderer</option>
          </select>
        </div>
        <div class="form-group">
          <label>Serie</label>
          <select id="f-ongoing">
            <option value="true">Laufend 🔄</option>
            <option value="false">Abgeschlossen ✓</option>
            <option value="unknown">Unbekannt ?</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div class="form-group">
          <label>Bände erschienen (DE)</label>
          <input id="f-total" type="number" min="0" placeholder="z.B. 27">
        </div>
      </div>
      <div class="form-group">
        <label>Meine Bände <span style="font-weight:400;color:var(--text-muted);font-size:0.75rem">– Klicken zum Status wechseln</span></label>
        <div class="band-mgr-list" id="band-mgr"></div>
        <button type="button" class="btn-add-band" onclick="addNextBand()">＋ Nächsten Band hinzufügen</button>
        <div style="display:flex;gap:6px;margin-top:7px">
          <input type="number" id="bulk-until" min="1" placeholder="Bis Band Nr. …" style="flex:1;border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;font-size:0.82rem;font-family:inherit;outline:none;background:var(--bg);color:var(--text)">
          <button type="button" onclick="bulkComplete()" style="border:1.5px solid var(--border);border-radius:8px;padding:7px 12px;background:var(--bg);color:var(--text-muted);font-size:0.78rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:background 0.12s" onmouseover="this.style.background='#d1fae5';this.style.color='#065f46'" onmouseout="this.style.background='var(--bg)';this.style.color='var(--text-muted)'">✓ Alle abschließen</button>
        </div>
      </div>
      <div class="form-group">
        <label>Nächster Band erscheint (DE) <span style="font-weight:400;color:var(--text-muted)">– Erscheinungsdatum</span></label>
        <input id="f-nextdate" type="date">
        <button type="button" id="btn-release-check" onclick="openReleasePreviewForCurrentSeries()" title="Release-Cache noch nicht geladen" style="margin-top:6px;width:100%;border:1.5px solid var(--border);border-radius:8px;padding:8px 11px;background:var(--bg);color:var(--text-muted);font-size:0.78rem;font-weight:700;cursor:pointer;transition:background 0.12s;display:none;opacity:0.4" onmouseover="this.style.background='var(--primary-light)'" onmouseout="this.style.background='var(--bg)'">📅 Release-Daten prüfen</button>
      </div>
      <div class="form-group">
        <label>Cover-Bild URL <span style="font-weight:400;color:var(--text-muted)">optional · Serien-Fallback wenn kein Band-1-Cover vorhanden ist</span></label>
        <input id="f-cover" type="url" placeholder="https://...">
        <button type="button" onclick="mpSyncOne()" title="Band-Cover von Manga Passion laden" style="margin-top:6px;width:100%;border:1.5px solid var(--border);border-radius:8px;padding:8px 11px;background:var(--bg);color:var(--text-muted);font-size:0.78rem;font-weight:700;cursor:pointer;transition:background 0.12s" onmouseover="this.style.background='var(--primary-light)'" onmouseout="this.style.background='var(--bg)'">📥 Cover laden</button>
      </div>
      <div class="form-group">
        <label>Genre / Tags</label>
        <div class="genre-picker" id="genre-picker"></div>
      </div>
      <div class="form-group">
        <label>Notizen</label>
        <textarea id="f-notes" rows="2" placeholder="Eigene Notizen..." style="resize:vertical"></textarea>
      </div>
      <div class="row2">
        <div class="form-group">
          <label>Begonnen am <span style="font-weight:400;color:var(--text-muted)">optional</span></label>
          <input id="f-started" type="date">
        </div>
        <div class="form-group">
          <label>Abgeschlossen am <span style="font-weight:400;color:var(--text-muted)">optional</span></label>
          <input id="f-finished" type="date">
        </div>
      </div>
      <div class="form-group">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:0.8rem">
          <input type="checkbox" id="f-wishlist" style="width:16px;height:16px;accent-color:#7c3aed;cursor:pointer">
          💜 Auf Wunschliste setzen
          <span style="font-weight:400;color:var(--text-muted)">(Serien die du noch kaufen/starten möchtest)</span>
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-del" id="btn-del" onclick="doDelete()" style="display:none" title="Löschen">🗑</button>
      <button class="btn-full btn-cancel-full" onclick="closeModal()">Abbrechen</button>
      <button class="btn-full btn-save" onclick="doSave()">Speichern</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Release-Preview-Overlay (Phase 15c/15d) — nutzt bestehende Modal-CSS-Klassen, keine Designänderung -->
<div class="overlay" id="release-preview-overlay" style="display:none;z-index:110" onclick="overlayClickReleasePreview(event)">
  <div class="modal" id="release-preview-modal">
    <div class="modal-header">
      <h2 id="release-preview-title">Release-Daten prüfen</h2>
      <button class="close-btn" onclick="closeReleasePreview()">✕</button>
    </div>
    <div class="modal-body" id="release-preview-body" style="max-height:55vh;overflow-y:auto;min-height:80px">
    </div>
    <div class="modal-footer">
      <button class="btn-full btn-cancel-full" onclick="closeReleasePreview()">Abbrechen</button>
      <button class="btn-full btn-save" onclick="applySelectedReleaseUpdates()">Ausgewählte übernehmen</button>
    </div>
  </div>
</div>

<input type="file" id="import-file-input" accept=".json" style="display:none" onchange="handleImportFile(this)">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="./src/utils.js"></script>
<script src="./src/supabase.js"></script>
<script src="./src/app.js"></script>
</body>
</html>
