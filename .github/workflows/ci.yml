name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '37 4 * * *'

permissions:
  contents: read

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # ── Einheitlicher Validierungs-Runner (Phase 46a) ───────────────────────
      # Single Source of Truth: scripts/run-all-checks.js bündelt Syntax-Checks,
      # Validatoren, Tests und Security-Audit. Lokal identisch über
      #   node scripts/run-all-checks.js   (bzw. npm run validate)
      - name: Run all checks (syntax, validators, tests, security)
        run: node scripts/run-all-checks.js

      # Expliziter Syntax-Check der Coverage-Writer — der Runner deckt dies
      # bereits ab; diese Zeilen erhalten zusätzlich den Phase-22e/22f-Contract
      # (test-stats prüft, dass ci.yml die Coverage-Writer syntaktisch prüft).
      - name: Syntax — coverage report/summary writers
        if: always()
        run: |
          node --check scripts/write-release-cache-coverage-report.js
          node --check scripts/write-release-cache-coverage-summary.js

      # ── Coverage-Gap-Artefakt (unverändert, CI-spezifisch) ──────────────────
      - name: Write release cache coverage gap report
        if: always()
        run: node scripts/write-release-cache-coverage-report.js

      - name: Write release cache coverage GitHub summary
        if: always()
        run: node scripts/write-release-cache-coverage-summary.js

      - name: Upload release cache coverage gap report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-cache-coverage-report
          path: artifacts/release-cache-coverage-report.json
          if-no-files-found: error
