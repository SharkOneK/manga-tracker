name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ── Syntax-Checks ──────────────────────────────────────────────────────
      - name: Syntax — src/app.js
        run: node --check src/app.js

      - name: Syntax — src/utils.js
        run: node --check src/utils.js

      - name: Syntax — src/supabase.js
        run: node --check src/supabase.js

      - name: Syntax — scripts/validate-release-cache.js
        run: node --check scripts/validate-release-cache.js

      - name: Syntax — scripts/update-release-cache.js
        run: node --check scripts/update-release-cache.js

      - name: Syntax — scripts/smoke-test-static.js
        run: node --check scripts/smoke-test-static.js

      - name: Syntax — scripts/check-secrets.js
        run: node --check scripts/check-secrets.js

      - name: Syntax — scripts/test-stats.js
        run: node --check scripts/test-stats.js

      - name: Check release-utils syntax
        run: node --check src/release-utils.js

      - name: Check test-data-integrity syntax
        run: node --check scripts/test-data-integrity.js

      # ── Validierung ────────────────────────────────────────────────────────
      - name: Validate release cache
        run: node scripts/validate-release-cache.js

      - name: Smoke test — statische Struktur
        run: node scripts/smoke-test-static.js

      - name: Secret check
        run: node scripts/check-secrets.js

      - name: Stats tests — Phase 17a + 17b
        run: node scripts/test-stats.js

      - name: Data integrity tests
        run: node scripts/test-data-integrity.js
