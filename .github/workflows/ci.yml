name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '37 4 * * *'

permissions:
  contents: read

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies (for audit)
        run: npm ci

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high

      # ── Einheitlicher Validierungs-Runner (Phase 46a) ───────────────────────
      # Single Source of Truth: scripts/run-all-checks.js bündelt Syntax-Checks,
      # Validatoren, Tests und Security-Audit. Lokal identisch über
      #   node scripts/run-all-checks.js   (bzw. npm run validate)
      - name: Run all checks (syntax, validators, tests, security)
        run: node scripts/run-all-checks.js

      # Expliziter Syntax-Check der Coverage-Writer — der Runner deckt dies
      # bereits ab; diese Zeilen erhalten zusätzlich den Phase-22e/22f-Contract
      # (test-stats prüft, dass ci.yml die Coverage-Writer syntaktisch prüft).
      - name: Syntax — coverage report/summary writers
        if: always()
        run: |
          node --check scripts/write-release-cache-coverage-report.js
          node --check scripts/write-release-cache-coverage-summary.js

      # ── Coverage-Gap-Artefakt (unverändert, CI-spezifisch) ──────────────────
      - name: Write release cache coverage gap report
        if: always()
        run: node scripts/write-release-cache-coverage-report.js

      - name: Write release cache coverage GitHub summary
        if: always()
        run: node scripts/write-release-cache-coverage-summary.js

      - name: Upload release cache coverage gap report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-cache-coverage-report
          path: artifacts/release-cache-coverage-report.json
          if-no-files-found: error

      - name: Check failure mail configuration
        id: mail_config
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'push')
        env:
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          if [ -n "$MAIL_HOST" ] && [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ] && [ -n "$MAIL_TO" ] && [ -n "$MAIL_FROM" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "MAIL_* secrets incomplete; skipping CI failure mail."
          fi

      - name: Write CI failure mail body
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'push')
        run: |
          mkdir -p artifacts
          {
            echo "Manga Tracker CI Status"
            echo ""
            echo "Workflow: ${GITHUB_WORKFLOW}"
            echo "Result: failure"
            echo "Trigger: ${GITHUB_EVENT_NAME}"
            echo "Branch: ${GITHUB_REF_NAME:-unknown}"
            echo "Commit: ${GITHUB_SHA:0:7}"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "Manual review required: one or more CI validation steps failed."
            echo "This mail contains only workflow metadata and no secrets or private data."
          } > artifacts/ci-failure-status-mail.txt

      - name: Send CI failure mail
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'push') && steps.mail_config.outputs.enabled == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: ${{ secrets.MAIL_HOST }}
          server_port: ${{ vars.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Manga Tracker CI: failure"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          body: file://artifacts/ci-failure-status-mail.txt
