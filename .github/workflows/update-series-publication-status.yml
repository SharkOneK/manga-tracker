name: Update Series Publication Status

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-series-publication-status
  cancel-in-progress: false

jobs:
  update-series-publication-status:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check Phase 57 syntax
        run: |
          node --check scripts/run-series-publication-status.js
          node --check scripts/validate-series-publication-status.js
          node --check scripts/test-series-publication-status.js
          node --check scripts/validate-bot-data-automerge-gate.js
          node --check scripts/test-bot-data-automerge-gate.js

      - name: Run publication status pipeline
        run: node scripts/run-series-publication-status.js

      - name: Validate Phase 57 artifacts and gates
        run: |
          node scripts/validate-series-publication-status.js
          node scripts/test-series-publication-status.js
          node scripts/test-bot-data-automerge-gate.js
          node scripts/test-public-private-diff.js
          node scripts/check-secrets.js
          node scripts/security-audit-static.js
          git diff --check

      - name: Prepare Phase 57 PR body
        shell: bash
        run: |
          node <<'NODE' > "$RUNNER_TEMP/series-publication-status-pr-body.md"
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('data/series-publication-status-report.json', 'utf8'));
          const s = report.summary || {};
          console.log('## Phase 57 Series Publication Status Summary');
          console.log('');
          console.log(`- Generated at: ${report.generatedAt}`);
          console.log(`- Series with status: ${s.seriesWithStatus || 0}`);
          console.log(`- Ongoing (laufend): ${s.ongoing || 0}`);
          console.log(`- Finished (abgeschlossen): ${s.finished || 0}`);
          console.log(`- Checked editions: ${s.checkedEditions || 0}`);
          console.log(`- Applied changes: ${s.appliedChanges || 0}`);
          console.log(`- Blocked/unmapped: ${s.blockedOrUnmapped || 0}`);
          console.log('');
          console.log('Only public technical metadata (DE publication status) is written. No private owner data, notes, read status or possession details are part of this PR. Writing the status into the Supabase collection is a separate, gated step and is NOT part of this automated PR.');
          NODE

      - name: Detect publication status changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/series-publication-status.json data/series-publication-status-report.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No publication-status changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/series-publication-status.json data/series-publication-status-report.json
          fi

      - name: Create publication status PR
        if: steps.changes.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update series publication status"
          branch: automated/series-publication-status
          delete-branch: true
          title: "chore: update series publication status"
          body-path: ${{ runner.temp }}/series-publication-status-pr-body.md
          labels: phase-57, series-publication-status, automated
          add-paths: |
            data/series-publication-status.json
            data/series-publication-status-report.json

      # Phase 83: bisher endete dieser Workflow beim PR — er wurde nie gemerged
      # (Audit-Befund 6). Gate + Merge spiegeln das Phase-43-Muster aus
      # .github/workflows/update-release-volume-counts.yml:105-143.
      - name: Validate Phase 83 auto-merge gate
        if: steps.cpr.outputs.pull-request-number != ''
        id: automerge_gate
        shell: bash
        run: |
          git fetch --no-tags origin \
            main:refs/remotes/origin/main \
            automated/series-publication-status:refs/remotes/origin/automated/series-publication-status
          git checkout --detach origin/automated/series-publication-status

          node scripts/validate-bot-data-automerge-gate.js --domain series-publication-status --base origin/main --json > "$RUNNER_TEMP/series-publication-status-gate.json" || true
          cat "$RUNNER_TEMP/series-publication-status-gate.json"

          allowed=$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(r.allowed ? 'true' : 'false')" "$RUNNER_TEMP/series-publication-status-gate.json")
          gate_class=$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(r.class)" "$RUNNER_TEMP/series-publication-status-gate.json")
          reason=$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(r.reason)" "$RUNNER_TEMP/series-publication-status-gate.json")

          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "class=$gate_class" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

          {
            echo "## Phase 83 Series Publication Status Auto-Merge Gate"
            echo ""
            echo "- Decision: $([ "$allowed" = "true" ] && echo "allowed" || echo "blocked")"
            echo "- PR class: $gate_class"
            echo "- Reason: $reason"
            echo ""
            echo "### PR diff files evaluated"
            node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); for (const file of r.changedFiles || []) console.log('- ' + file)" "$RUNNER_TEMP/series-publication-status-gate.json"
            echo ""
            echo "### Gate metrics"
            node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); for (const key of ['baseItems','headItems','additions','updates','contentUpdates','deletions']) if (Object.prototype.hasOwnProperty.call(r, key)) console.log('- ' + key + ': ' + r[key])" "$RUNNER_TEMP/series-publication-status-gate.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enable auto-merge for safe publication status PRs
        if: steps.automerge_gate.outputs.allowed == 'true'
        id: auto_merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        # Das Repo hat allow_auto_merge=false (gemessen 2026-09-26). `--auto` kann daher
        # keinen Auto-Merge aktivieren; gh merged bei bereits mergefaehigen Bot-PRs sofort
        # durch. Schlaegt das fehl, wird bewusst direkt gemerged — das Gate hat zu diesem
        # Zeitpunkt bereits entschieden. Wird allow_auto_merge spaeter aktiviert, greift
        # automatisch wieder der echte Auto-Merge-Pfad. Kein continue-on-error: schlaegt
        # auch der Direkt-Merge fehl, soll der Job rot werden statt still zu haengen.
        run: |
          if ! gh pr merge "$PR" --squash --delete-branch --auto; then
            echo "::warning::--auto unavailable (allow_auto_merge=false?); falling back to a direct squash merge"
            gh pr merge "$PR" --squash --delete-branch
          fi
          echo "triggered=true" >> "$GITHUB_OUTPUT"

      - name: Upload Phase 57 report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: series-publication-status-report
          path: data/series-publication-status-report.json
          if-no-files-found: ignore
