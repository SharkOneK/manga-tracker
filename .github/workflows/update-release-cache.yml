name: Update Release Cache

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-release-cache
  cancel-in-progress: false

jobs:
  update-release-cache:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check release pipeline syntax
        run: |
          node --check scripts/release-confidence.js
          node --check scripts/run-release-cache-pipeline.js
          node --check scripts/release-providers/index.js
          node --check scripts/release-providers/provider-utils.js
          node --check scripts/release-providers/manga-passion-provider.js
          node --check scripts/validate-release-cache-pipeline-report.js
          node --check scripts/validate-release-cache-automerge-gate.js
          node --check scripts/update-release-cache.js
          node --check scripts/validate-release-cache.js
          node --check scripts/validate-release-watchlist.js
          node --check scripts/write-release-source-review-queue.js
          node --check scripts/validate-release-source-review-queue.js
          node --check scripts/audit-release-cache-coverage.js
          node --check scripts/test-public-projection.js
          node --check scripts/test-automerge-gate.js

      - name: Run automated release-cache pipeline
        run: node scripts/run-release-cache-pipeline.js

      - name: Validate release-cache artifacts
        run: |
          node scripts/validate-release-cache-pipeline-report.js
          node scripts/validate-release-cache.js
          node scripts/validate-release-watchlist.js
          node scripts/write-release-source-review-queue.js
          node scripts/validate-release-source-review-queue.js
          node scripts/audit-release-cache-coverage.js --json
          node scripts/write-release-cache-coverage-report.js
          node scripts/write-release-cache-coverage-summary.js
          node scripts/validate-release-cache-coverage-gaps.js
          node scripts/test-stats.js
          node scripts/test-automerge-gate.js
          node scripts/smoke-test-static.js
          node scripts/check-secrets.js
          node scripts/test-data-integrity.js
          node scripts/test-public-projection.js
          node scripts/security-audit-static.js
          git diff --check

      - name: Prepare release-cache PR body
        shell: bash
        run: |
          node <<'NODE' > "$RUNNER_TEMP/release-cache-pr-body.md"
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('data/release-cache-pipeline-report.json', 'utf8'));
          const s = report.summary;
          console.log('## Release-Cache Pipeline Summary');
          console.log('');
          console.log(`- Generated at: ${report.generatedAt}`);
          console.log(`- Candidates checked: ${s.candidatesChecked}/${s.candidatesDiscovered}`);
          console.log(`- High confidence: ${s.highConfidence}`);
          console.log(`- Medium confidence: ${s.mediumConfidence}`);
          console.log(`- Low confidence: ${s.lowConfidence}`);
          console.log(`- Blocked: ${s.blocked}`);
          console.log(`- Cache patches: ${s.cachePatches}`);
          console.log(`- Review-queue writes: ${s.reviewQueueWrites}`);
          console.log(`- Auto-merge eligible: ${report.autoMergeEligible ? 'yes' : 'no'}`);
          console.log('');
          console.log('Unsafe or ambiguous candidates are kept in `data/release-source-review-queue.json`; only `confidence: "high"` cache patches are written to `data/release-cache.json`.');
          NODE

      - name: Detect release-cache pipeline changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- \
            data/release-cache.json \
            data/release-source-review-queue.json \
            data/release-cache-pipeline-report.json \
            docs/release-cache-coverage-gaps.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No release-cache pipeline changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- \
              data/release-cache.json \
              data/release-source-review-queue.json \
              data/release-cache-pipeline-report.json \
              docs/release-cache-coverage-gaps.md
          fi

      - name: Create release-cache update PR
        if: steps.changes.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update release cache pipeline artifacts"
          branch: automated/release-cache-pipeline
          delete-branch: true
          title: "chore: update release cache pipeline artifacts"
          body-path: ${{ runner.temp }}/release-cache-pr-body.md
          labels: release-cache, automated
          add-paths: |
            data/release-cache.json
            data/release-source-review-queue.json
            data/release-cache-pipeline-report.json
            docs/release-cache-coverage-gaps.md

      - name: Block auto-merge if PR number is missing
        if: steps.changes.outputs.changed == 'true' && steps.cpr.outputs.pull-request-number == ''
        run: |
          {
            echo "## Release-Cache Auto-Merge Gate"
            echo ""
            echo "- Decision: blocked"
            echo "- Reason: PR number is missing; default deny."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate report/queue-only auto-merge gate
        if: steps.cpr.outputs.pull-request-number != ''
        id: automerge_gate
        shell: bash
        run: |
          git fetch --no-tags origin \
            main:refs/remotes/origin/main \
            automated/release-cache-pipeline:refs/remotes/origin/automated/release-cache-pipeline
          git checkout --detach origin/automated/release-cache-pipeline

          node scripts/validate-release-cache-automerge-gate.js --base origin/main --json > "$RUNNER_TEMP/automerge-gate.json"
          cat "$RUNNER_TEMP/automerge-gate.json"

          allowed=$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(r.allowed ? 'true' : 'false')" "$RUNNER_TEMP/automerge-gate.json")
          gate_class=$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(r.class)" "$RUNNER_TEMP/automerge-gate.json")
          reason=$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(r.reason)" "$RUNNER_TEMP/automerge-gate.json")

          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "class=$gate_class" >> "$GITHUB_OUTPUT"

          {
            echo "## Release-Cache Auto-Merge Gate"
            echo ""
            echo "- Decision: $([ "$allowed" = "true" ] && echo "allowed" || echo "blocked")"
            echo "- PR class: $gate_class"
            echo "- Reason: $reason"
            echo ""
            echo "### Changed files"
            node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); for (const file of r.changedFiles || []) console.log('- ' + file)" "$RUNNER_TEMP/automerge-gate.json"
            echo ""
            echo "### Gate metrics"
            node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); for (const key of ['cachePatches','safeToPatchBefore','safeToPatchAfter']) if (Object.prototype.hasOwnProperty.call(r, key)) console.log('- ' + key + ': ' + r[key])" "$RUNNER_TEMP/automerge-gate.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enable auto-merge for safe report/queue-only PRs
        if: steps.automerge_gate.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --squash --auto
