name: Update release cache

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-release-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build release cache
        run: node scripts/update-release-cache.js

      - name: Commit release cache if changed
        run: |
          if git diff --quiet -- data/release-cache.json; then
            echo "release-cache.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/release-cache.json
          git commit -m "Update release cache"
          git push
