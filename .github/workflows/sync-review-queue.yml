name: Sync Review Queue (Phase 39e)

# Phase 39e: spiegelt data/release-source-review-queue.json -> Supabase candidates.
# Manueller Trigger only - kein cron, weil service_role im Spiel.
# Erzeugt PR ohne Auto-Merge.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur zaehlen, nicht schreiben'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-review-queue
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check 39e script syntax
        run: |
          node --check scripts/sync-review-queue-to-supabase.js
          node --check scripts/report-review-queue-supabase-coverage.js

      - name: Fail fast if secrets missing
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Phase 39e requires SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY secrets."
            exit 1
          fi

      - name: Sync queue -> candidates
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/sync-review-queue-to-supabase.js --dry-run
          else
            node scripts/sync-review-queue-to-supabase.js
          fi

      - name: Build coverage report
        run: node scripts/report-review-queue-supabase-coverage.js

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/release-source-review-queue-sync-report.json data/release-source-review-queue-coverage.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No 39e artifact changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/release-source-review-queue-sync-report.json data/release-source-review-queue-coverage.json
          fi

      - name: Prepare PR body
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          node <<'NODE' > "$RUNNER_TEMP/sync-pr-body.md"
          const fs = require('fs');
          const sync = JSON.parse(fs.readFileSync('data/release-source-review-queue-sync-report.json', 'utf8'));
          const cov  = JSON.parse(fs.readFileSync('data/release-source-review-queue-coverage.json', 'utf8'));
          console.log('## Phase 39e Sync + Coverage');
          console.log('');
          console.log('### Sync (' + (sync.dryRun ? 'dry-run' : 'live') + ')');
          console.log('- queueTotal: ' + sync.queueTotal);
          console.log('- eligibleTotal: ' + sync.eligibleTotal);
          console.log('- counts: ' + JSON.stringify(sync.counts));
          console.log('');
          console.log('### Coverage');
          console.log('- inQueueAndVerifiedEntry: ' + cov.counts.inQueueAndVerifiedEntry);
          console.log('- inQueueAndCandidate:     ' + cov.counts.inQueueAndCandidate);
          console.log('- inQueueOnly:             ' + cov.counts.inQueueOnly);
          console.log('');
          console.log('Diese Phase entfernt NICHTS aus release-source-review-queue.json. Reine Diagnose + Spiegelung.');
          NODE

      - name: Create PR (no auto-merge)
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: refresh phase 39e sync + coverage artifacts"
          branch: automated/phase39e-review-queue-sync
          delete-branch: true
          title: "chore: refresh phase 39e sync + coverage artifacts"
          body-path: ${{ runner.temp }}/sync-pr-body.md
          labels: phase39e, automated
          add-paths: |
            data/release-source-review-queue-sync-report.json
            data/release-source-review-queue-coverage.json

  notify:
    name: Send failure status mail
    needs: sync
    if: always() && needs.sync.result == 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Check mail configuration
        id: mail_config
        env:
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          if [ -n "$MAIL_HOST" ] && [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ] && [ -n "$MAIL_TO" ] && [ -n "$MAIL_FROM" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "MAIL_* secrets incomplete; skipping Sync Review Queue failure mail."
          fi

      - name: Write failure mail body
        run: |
          mkdir -p artifacts
          {
            echo "Manga Tracker Sync Review Queue Status"
            echo ""
            echo "Workflow: ${GITHUB_WORKFLOW}"
            echo "Result: ${{ needs.sync.result }}"
            echo "Trigger: ${GITHUB_EVENT_NAME}"
            echo "Branch: ${GITHUB_REF_NAME:-unknown}"
            echo "Commit: ${GITHUB_SHA:0:7}"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "Manual review required: Sync Review Queue failed before a safe no-op/PR result."
            echo "This mail contains only workflow metadata and no secrets or private data."
          } > artifacts/sync-review-queue-failure-status-mail.txt

      - name: Send failure mail
        if: steps.mail_config.outputs.enabled == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: ${{ secrets.MAIL_HOST }}
          server_port: ${{ vars.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Manga Tracker Sync Review Queue: ${{ needs.sync.result }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          body: file://artifacts/sync-review-queue-failure-status-mail.txt
