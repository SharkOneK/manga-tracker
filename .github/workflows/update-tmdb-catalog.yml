name: Update TMDB Series Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-tmdb-catalog
  cancel-in-progress: false

jobs:
  update-tmdb-catalog:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check Phase 75 syntax
        run: |
          node --check scripts/tmdb-provider.js
          node --check scripts/update-tmdb-catalog.js
          node --check scripts/validate-tmdb-watchlist.js
          node --check scripts/validate-tmdb-series-catalog.js
          node --check scripts/test-tmdb-provider.js
          node --check scripts/validate-bot-data-automerge-gate.js
          node --check scripts/test-bot-data-automerge-gate.js

      - name: Fail fast if TMDB_API_KEY missing
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::error::Phase 75 requires the TMDB_API_KEY secret."
            exit 1
          fi

      - name: Run TMDB catalog pipeline
        run: node scripts/update-tmdb-catalog.js

      - name: Validate Phase 75 artifacts and gates
        run: |
          node scripts/validate-tmdb-watchlist.js
          node scripts/validate-tmdb-series-catalog.js
          node scripts/test-tmdb-provider.js
          node scripts/test-bot-data-automerge-gate.js
          node scripts/test-public-private-diff.js
          node scripts/check-secrets.js
          node scripts/security-audit-static.js
          git diff --check

      - name: Detect catalog changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/tmdb-series-catalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No tmdb-series-catalog changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/tmdb-series-catalog.json
          fi

      - name: Prepare Phase 75 PR body
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          node <<'NODE' > "$RUNNER_TEMP/tmdb-catalog-pr-body.md"
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('data/tmdb-series-catalog.json', 'utf8'));
          console.log('## Phase 75 TMDB Series Catalog Update');
          console.log('');
          console.log(`- Generated at: ${catalog.generatedAt}`);
          console.log(`- Series in catalog: ${catalog.items.length}`);
          console.log('');
          console.log('Only public, sanitized TMDB metadata (title, network, episode/season counts, cover, genres, overview) is written. No API key, no raw TMDB response, no private collection data is part of this PR.');
          NODE

      - name: Create TMDB catalog PR
        if: steps.changes.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update tmdb series catalog"
          branch: automated/tmdb-series-catalog
          delete-branch: true
          title: "chore: update tmdb series catalog"
          body-path: ${{ runner.temp }}/tmdb-catalog-pr-body.md
          labels: phase-75, tmdb-catalog, automated
          add-paths: |
            data/tmdb-series-catalog.json

      # Phase 83: bisher endete dieser Workflow beim PR — er wurde nie gemerged
      # (Audit-Befund 6). Gate + Merge spiegeln das Phase-43-Muster aus
      # .github/workflows/update-release-volume-counts.yml:105-143.
      - name: Validate Phase 83 auto-merge gate
        if: steps.cpr.outputs.pull-request-number != ''
        id: automerge_gate
        shell: bash
        run: |
          git fetch --no-tags origin \
            main:refs/remotes/origin/main \
            automated/tmdb-series-catalog:refs/remotes/origin/automated/tmdb-series-catalog
          git checkout --detach origin/automated/tmdb-series-catalog

          node scripts/validate-bot-data-automerge-gate.js --domain tmdb-series-catalog --base origin/main --json > "$RUNNER_TEMP/tmdb-series-catalog-gate.json" || true
          cat "$RUNNER_TEMP/tmdb-series-catalog-gate.json"

          allowed=$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(r.allowed ? 'true' : 'false')" "$RUNNER_TEMP/tmdb-series-catalog-gate.json")
          gate_class=$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(r.class)" "$RUNNER_TEMP/tmdb-series-catalog-gate.json")
          reason=$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(r.reason)" "$RUNNER_TEMP/tmdb-series-catalog-gate.json")

          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "class=$gate_class" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

          {
            echo "## Phase 83 TMDB Series Catalog Auto-Merge Gate"
            echo ""
            echo "- Decision: $([ "$allowed" = "true" ] && echo "allowed" || echo "blocked")"
            echo "- PR class: $gate_class"
            echo "- Reason: $reason"
            echo ""
            echo "### PR diff files evaluated"
            node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); for (const file of r.changedFiles || []) console.log('- ' + file)" "$RUNNER_TEMP/tmdb-series-catalog-gate.json"
            echo ""
            echo "### Gate metrics"
            node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); for (const key of ['baseItems','headItems','additions','updates','contentUpdates','deletions']) if (Object.prototype.hasOwnProperty.call(r, key)) console.log('- ' + key + ': ' + r[key])" "$RUNNER_TEMP/tmdb-series-catalog-gate.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enable auto-merge for safe TMDB catalog PRs
        if: steps.automerge_gate.outputs.allowed == 'true'
        id: auto_merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        # Das Repo hat allow_auto_merge=false (gemessen 2026-09-26). `--auto` kann daher
        # keinen Auto-Merge aktivieren; gh merged bei bereits mergefaehigen Bot-PRs sofort
        # durch. Schlaegt das fehl, wird bewusst direkt gemerged — das Gate hat zu diesem
        # Zeitpunkt bereits entschieden. Wird allow_auto_merge spaeter aktiviert, greift
        # automatisch wieder der echte Auto-Merge-Pfad. Kein continue-on-error: schlaegt
        # auch der Direkt-Merge fehl, soll der Job rot werden statt still zu haengen.
        run: |
          if ! gh pr merge "$PR" --squash --delete-branch --auto; then
            echo "::warning::--auto unavailable (allow_auto_merge=false?); falling back to a direct squash merge"
            gh pr merge "$PR" --squash --delete-branch
          fi
          echo "triggered=true" >> "$GITHUB_OUTPUT"
